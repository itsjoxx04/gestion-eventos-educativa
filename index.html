<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-key="title-login">Login - Gestión de Eventos</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea, #764ba2); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-box { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            width: 350px; 
            text-align: center;
        }
        h2 { margin-bottom: 30px; color: #333; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 12px 0; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box;
            font-size: 16px;
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background: #4e54c8; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            margin-top: 10px;
        }
        button:hover { background: #3b3f9e; }
        #msg { 
            color: red; 
            margin-top: 15px; 
            font-weight: bold;
        }
        .attempts { color: #888; font-size: 14px; margin-top: 10px; }
        .lang-selector { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2 data-key="system-name">Gestión de Eventos</h2>
        <p style="color: #666; margin-bottom: 20px;" data-key="restricted-access">Acceso restringido</p>
        
        <input type="text" id="username" data-key="placeholder-username" placeholder="Usuario" autocomplete="username">
        <input type="password" id="password" data-key="placeholder-password" placeholder="Contraseña" autocomplete="current-password">
        
        <button onclick="login()" data-key="login-btn">Iniciar Sesión</button>
        
        <p id="msg"></p>
        <p class="attempts" id="attempts-left"></p>

        <div class="lang-selector">
            <select id="language-select">
                <option value="es">Español</option>
                <option value="en">English</option>
            </select>
        </div>
    </div>

    <script>
        // Traducciones completas
        const translations = {
            es: {
                "title-login": "Login - Gestión de Eventos",
                "system-name": "Gestión de Eventos",
                "restricted-access": "Acceso restringido",
                "placeholder-username": "Usuario",
                "placeholder-password": "Contraseña",
                "login-btn": "Iniciar Sesión",
                "empty-fields": "Por favor, complete ambos campos",
                "success-login": "¡Acceso concedido! Redirigiendo...",
                "invalid-credentials": "Usuario o contraseña incorrectos"
            },
            en: {
                "title-login": "Login - Event Management",
                "system-name": "Event Management",
                "restricted-access": "Restricted Access",
                "placeholder-username": "Username",
                "placeholder-password": "Password",
                "login-btn": "Log In",
                "empty-fields": "Please fill both fields",
                "success-login": "Access granted! Redirecting...",
                "invalid-credentials": "Incorrect username or password"
            }
        };

        let currentLang = localStorage.getItem('lang') || 'es';

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if (translations[lang][key]) {
                    if (el.tagName === 'INPUT') el.placeholder = translations[lang][key];
                    else if (el.tagName === 'TITLE') document.title = translations[lang][key];
                    else el.textContent = translations[lang][key];
                }
            });
        }

        // Listener para el selector de idioma
        document.getElementById('language-select').addEventListener('change', (e) => {
            changeLanguage(e.target.value);
        });

        // Credenciales
        const USUARIO_CORRECTO = "Andy2005";
        const CONTRASENA_CORRECTA = "sanchezandys2";

        function login() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const msg = document.getElementById('msg');

            msg.textContent = '';

            if (!user || !pass) {
                msg.textContent = translations[currentLang]["empty-fields"];
                return;
            }

            if (user === USUARIO_CORRECTO && pass === CONTRASENA_CORRECTA) {
                sessionStorage.setItem('loggedIn', 'true');
                msg.style.color = 'green';
                msg.textContent = translations[currentLang]["success-login"];
                setTimeout(() => window.location.href = 'dashboard.html', 800);
            } else {
                msg.textContent = translations[currentLang]["invalid-credentials"];
            }
        }

        document.addEventListener('keypress', e => { if (e.key === 'Enter') login(); });

        // Inicializar idioma al cargar
        changeLanguage(currentLang);
    </script>
</body>
</html>
